<!DOCTYPE html>

<head>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #05070f;
      color: #e5e7eb;
    }

    header {
      text-align: center;
      padding: 45px 20px;
      background: radial-gradient(circle at top, #1e3a8a, #020617 70%);
      box-shadow: 0 0 45px rgba(59,130,246,0.45);
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      color: #60a5fa;
      text-shadow: 0 0 18px rgba(96,165,250,0.9);
    }

    header p {
      margin-top: 10px;
      color: #93c5fd;
      opacity: 0.9;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: linear-gradient(180deg, #020617, #020617);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.25),
        0 20px 50px rgba(0,0,0,0.85);
      transition: 0.3s ease;
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(59,130,246,0.4);
      opacity: 0;
      transition: 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563eb, #22d3ee);
      color: #020617;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(34,211,238,0.9);
    }

    .card h2 {
      margin: 10px 0;
      color: #60a5fa;
      text-shadow: 0 0 10px rgba(96,165,250,0.7);
    }

    .features {
      text-align: left;
      margin: 20px 0;
      color: #c7d2fe;
      font-size: 14px;
      line-height: 1.7;
    }

    .features li {
      margin-bottom: 8px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #22d3ee;
      text-shadow: 0 0 14px rgba(34,211,238,0.9);
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #22d3ee);
      color: #020617;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 30px rgba(59,130,246,0.9);
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(34,211,238,1);
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

        Order via WhatsApp
      </a>

  <footer>
    © 2026 Yenz Store • Trusted & Secure
  </footer>

</html>
